<script>
// Show the page footer (set in _quarto.yml) as a card in the content
// column, directly below the links to the previous and next chapter.
document.addEventListener("DOMContentLoaded", function () {
  var text = document.querySelector(".nav-footer .nav-footer-center");
  var navigation = document.querySelector("nav.page-navigation");

  if (!text || !navigation) {
    return;
  }

  var card = document.createElement("div");
  card.className = "guide-page-footer";
  card.innerHTML = text.innerHTML;
  navigation.insertAdjacentElement("afterend", card);

  document.body.classList.add("has-guide-page-footer");
});
</script>


<script>
// Clearer browser tab titles: "User Guide: <chapter>" on the chapter
// pages, and the full name of the guide on the start page.
document.addEventListener("DOMContentLoaded", function () {
  var chapter = document.querySelector("h1.title .chapter-title");
  var isStartPage = document.body.classList.contains("intro-page");

  if (chapter && !isStartPage) {
    document.title = "User Guide: " + chapter.textContent.trim();
  } else {
    document.title = "Training Webpage Template – User Guide";
  }
});
</script>
